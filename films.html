<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Index — DUBOXD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="films">
  <div id="site-header-mount"></div>

  <main class="site-container py-4">
    <div class="film-action-panel mb-4">
      <div class="row g-2 align-items-end">
        <div class="col-md-6">
          <label class="form-label-caps">Search by Title, Director, or Year</label>
          <input type="text" id="catalog-search-input" class="form-control-dark" placeholder="Search films...">
        </div>
        <div class="col-md-3">
          <label class="form-label-caps">Genre Filter</label>
          <select id="catalog-genre-select" class="form-select-dark">
            <option value="all">All Genres</option>
            <option value="Drama">Drama</option>
            <option value="Romance">Romance</option>
            <option value="Crime">Crime</option>
            <option value="Thriller">Thriller</option>
            <option value="Mystery">Mystery</option>
            <option value="History">History</option>
            <option value="Documentary">Documentary</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label-caps">Order By</label>
          <select id="catalog-sort-select" class="form-select-dark">
            <option value="popular">Popular on Campus</option>
            <option value="rating">Highest Rated</option>
            <option value="year">Release Year</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section-bar">
      <h1 class="section-title">Archive &amp; TMDB Catalog</h1>
      <span class="section-link" id="catalog-count-label">LOADING...</span>
    </div>

    <div class="poster-grid-6" id="films-catalog-grid"></div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
