<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Dossier — DUBOXD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="film">
  <div id="site-header-mount"></div>

  <div class="film-backdrop-wrap">
    <img id="detail-backdrop-img" class="film-backdrop-img" src="" alt="Backdrop">
    <div class="film-backdrop-fade"></div>
  </div>

  <main class="site-container pb-5">
    <section class="film-dossier mb-5">
      <div class="film-poster-large" id="detail-poster-mount"></div>

      <div>
        <h1 class="film-headline" id="detail-title">Loading...</h1>
        <div class="film-submeta" id="detail-meta"></div>
        <div class="film-tagline" id="detail-tagline"></div>
        <p class="film-synopsis" id="detail-synopsis"></p>

        <div class="mb-3">
          <div class="form-label-caps">Classification</div>
          <div class="genre-tags" id="detail-genres"></div>
        </div>

        <div>
          <div class="form-label-caps">Principal Cast</div>
          <div class="genre-tags" id="detail-cast"></div>
        </div>
      </div>

      <aside class="film-action-panel">
        <div class="panel-stat-box">
          <div>
            <div class="panel-stat-label">Member Rating</div>
            <div class="panel-stat-label" id="detail-du-count">0 Logs</div>
          </div>
          <div class="panel-stat-num" id="detail-du-score">4.5</div>
        </div>

        <div class="hist-bars">
          <div class="hist-bar-col"><div class="hist-bar-fill" style="height: 12%"></div></div>
          <div class="hist-bar-col"><div class="hist-bar-fill" style="height: 22%"></div></div>
          <div class="hist-bar-col"><div class="hist-bar-fill" style="height: 45%"></div></div>
          <div class="hist-bar-col"><div class="hist-bar-fill" style="height: 78%"></div></div>
          <div class="hist-bar-col"><div class="hist-bar-fill" style="height: 95%"></div></div>
        </div>

        <div class="d-grid gap-2">
          <button type="button" class="btn-crimson justify-content-center" id="btn-detail-log">+ Log or Review</button>
          <button type="button" class="btn-ghost justify-content-center" id="btn-detail-watchlist">+ Watchlist</button>
          <button type="button" class="btn-ochre text-center" id="btn-detail-favorite">Set as Top 4 Favorite</button>
        </div>
      </aside>
    </section>

    <section>
      <div class="section-bar">
        <h2 class="section-title">Member Reviews &amp; Dispatches</h2>
      </div>
      <div class="review-list" id="detail-reviews-mount"></div>
    </section>
  </main>

  <div id="site-footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
