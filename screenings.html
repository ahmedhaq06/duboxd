<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Screenings — DUBOXD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="screenings">
  <div id="site-header-mount"></div>

  <main class="site-container py-4">
    <div class="campus-strip mt-0">
      <div class="campus-strip-meta">
        <span class="eyebrow-tag">University of Dhaka Film Societies</span>
        <h1 class="campus-strip-title">Auditorium Projections &amp; Study Circles</h1>
        <div class="campus-strip-sub">Official screening roster across TSC Auditorium, RC Majumdar Auditorium, and Faculty Seminar Halls.</div>
      </div>
      <button type="button" class="btn-crimson" data-bs-toggle="modal" data-bs-target="#scheduleScreeningModal">+ Publish Screening</button>
    </div>

    <div class="section-bar">
      <h2 class="section-title">Upcoming Campus Projections</h2>
    </div>

    <div id="screenings-list-mount"></div>
  </main>

  <div class="modal fade" id="scheduleScreeningModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-dark">
        <div class="modal-header-dark">
          <h5 class="modal-title-caps">Publish Campus Screening</h5>
          <button type="button" class="btn-close-dark" data-bs-dismiss="modal">Close</button>
        </div>
        <div class="modal-body p-3">
          <form id="schedule-screening-form">
            <div class="row g-2 mb-3">
              <div class="col-8">
                <label class="form-label-caps">Film Title</label>
                <input type="text" id="scr-title" class="form-control-dark" placeholder="e.g. Charulata" required>
              </div>
              <div class="col-4">
                <label class="form-label-caps">Release Year</label>
                <input type="text" id="scr-year" class="form-control-dark" placeholder="1964" required>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label-caps">Director</label>
                <input type="text" id="scr-director" class="form-control-dark" placeholder="Satyajit Ray" required>
              </div>
              <div class="col-6">
                <label class="form-label-caps">Organizing Society / Dept</label>
                <input type="text" id="scr-club" class="form-control-dark" placeholder="DU Film Society (DUFS)" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label-caps">Auditorium / Venue</label>
              <input type="text" id="scr-venue" class="form-control-dark" placeholder="TSC Auditorium, Ground Floor" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label-caps">Date</label>
                <input type="date" id="scr-date" class="form-control-dark" required>
              </div>
              <div class="col-6">
                <label class="form-label-caps">Time</label>
                <input type="time" id="scr-time" class="form-control-dark" value="17:30" required>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label-caps">Projection Format</label>
                <input type="text" id="scr-format" class="form-control-dark" value="DCP Restoration" required>
              </div>
              <div class="col-6">
                <label class="form-label-caps">Entry Policy</label>
                <input type="text" id="scr-entry" class="form-control-dark" value="Open to all DU ID holders" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label-caps">Post-Screening Colloquium / Notes</label>
              <input type="text" id="scr-notes" class="form-control-dark" placeholder="Open forum following projection">
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn-crimson">Publish to Roster</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
