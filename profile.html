<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Dossier — DUBOXD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="profile">
  <div id="site-header-mount"></div>

  <main class="site-container pb-5">
    <section class="profile-banner">
      <div class="profile-identity">
        <div class="avatar-monogram" id="profile-monogram">--</div>
        <div>
          <h1 class="campus-strip-title mb-1" id="profile-name">Member</h1>
          <div class="d-flex flex-wrap gap-2 mb-2" id="profile-badges"></div>
          <div class="text-secondary" style="font-size: 12px;" id="profile-bio"></div>
        </div>
      </div>

      <div class="d-flex align-items-center gap-4">
        <div class="profile-stats">
          <div class="stat-item">
            <div class="stat-value" id="stat-total-logs">0</div>
            <div class="stat-caption">Diary Entries</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="stat-watchlist-count">0</div>
            <div class="stat-caption">Watchlist</div>
          </div>
        </div>
        <button type="button" class="btn-ghost" id="btn-sign-out">Sign Out</button>
      </div>
    </section>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="section-bar">
          <h2 class="section-title">Four Favorites</h2>
          <a href="films.html" class="section-link">Modify in Film Dossier</a>
        </div>
        <div class="poster-grid-4 mb-4" id="profile-favorites-grid"></div>

        <div class="section-bar">
          <h2 class="section-title">Screening Diary Ledger</h2>
        </div>
        <div class="film-action-panel p-0 overflow-hidden">
          <table class="diary-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Film</th>
                <th>Rating</th>
                <th>Log Type</th>
                <th>Member</th>
              </tr>
            </thead>
            <tbody id="profile-diary-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="section-bar">
          <h2 class="section-title">Member Watchlist</h2>
          <a href="films.html" class="section-link">+ Add Titles</a>
        </div>
        <div class="poster-grid-4" id="profile-watchlist-grid"></div>
      </div>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
