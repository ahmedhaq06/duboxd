<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Access — DUBOXD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
  <div id="site-header-mount"></div>

  <main class="site-container py-5">
    <div class="row g-4 justify-content-center">
      <div class="col-md-5">
        <div class="film-action-panel p-4 h-100">
          <div class="eyebrow-tag mb-1">Existing Member</div>
          <h1 class="campus-strip-title mb-3">Sign In</h1>
          <form id="form-signin">
            <div class="mb-3">
              <label class="form-label-caps">Email</label>
              <input type="email" id="signin-email" class="form-control-dark" placeholder="you@example.com" required>
            </div>
            <div class="mb-4">
              <label class="form-label-caps">Password</label>
              <input type="password" id="signin-password" class="form-control-dark" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-crimson w-100 justify-content-center">Sign In</button>
          </form>
        </div>
      </div>

      <div class="col-md-5">
        <div class="film-action-panel p-4 h-100">
          <div class="eyebrow-tag mb-1">New Account</div>
          <h2 class="campus-strip-title mb-3">Create Account</h2>
          <form id="form-signup">
            <div class="mb-3">
              <label class="form-label-caps">Name</label>
              <input type="text" id="signup-name" class="form-control-dark" placeholder="Your name" required>
            </div>
            <div class="mb-3">
              <label class="form-label-caps">Email</label>
              <input type="email" id="signup-email" class="form-control-dark" placeholder="you@example.com" required>
            </div>
            <div class="mb-4">
              <label class="form-label-caps">Password</label>
              <input type="password" id="signup-password" class="form-control-dark" placeholder="Minimum 6 characters" required>
            </div>
            <button type="submit" class="btn-ochre w-100 text-center">Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
