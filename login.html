<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Access — DUBOXD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
  <div id="site-header-mount"></div>

  <main class="site-container py-5">
    <div class="row g-4 justify-content-center">
      <div class="col-md-5">
        <div class="film-action-panel p-4 h-100">
          <div class="eyebrow-tag mb-1">Existing Member</div>
          <h1 class="campus-strip-title mb-3">Sign In to Ledger</h1>
          <form id="form-signin">
            <div class="mb-3">
              <label class="form-label-caps">Institutional or Personal Email</label>
              <input type="email" id="signin-email" class="form-control-dark" placeholder="member@du.ac.bd" required>
            </div>
            <div class="mb-4">
              <label class="form-label-caps">Password</label>
              <input type="password" id="signin-password" class="form-control-dark" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-crimson w-100 justify-content-center">Access Member Dossier</button>
          </form>
        </div>
      </div>

      <div class="col-md-6">
        <div class="film-action-panel p-4">
          <div class="eyebrow-tag mb-1">New Registration</div>
          <h2 class="campus-strip-title mb-3">Enroll DU Member Dossier</h2>
          <form id="form-signup">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label-caps">Full Name</label>
                <input type="text" id="signup-name" class="form-control-dark" placeholder="Full Name" required>
              </div>
              <div class="col-6">
                <label class="form-label-caps">Email Address</label>
                <input type="email" id="signup-email" class="form-control-dark" placeholder="email@du.ac.bd" required>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label-caps">Department / Institute</label>
                <input type="text" id="signup-dept" class="form-control-dark" placeholder="Television, Film &amp; Photography" required>
              </div>
              <div class="col-6">
                <label class="form-label-caps">Hall / Residence</label>
                <input type="text" id="signup-hall" class="form-control-dark" placeholder="Rokeya Hall" required>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label-caps">Batch / Session</label>
                <input type="text" id="signup-batch" class="form-control-dark" placeholder="Batch 25" required>
              </div>
              <div class="col-6">
                <label class="form-label-caps">Password</label>
                <input type="password" id="signup-password" class="form-control-dark" placeholder="Minimum 6 characters" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label-caps">Critical Interests / Bio</label>
              <input type="text" id="signup-bio" class="form-control-dark" placeholder="South Asian parallel cinema, Iranian realism, 35mm restoration">
            </div>
            <button type="submit" class="btn-ochre w-100 text-center">Create Member Dossier</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
